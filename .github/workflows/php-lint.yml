name: PHP Lint

on:
  push:
    branches: [main, develop]
    paths:
      - "warranty-code-manager/*.php"
      - "warranty-code-manager/**/*.php"
  pull_request:
    paths:
      - "warranty-code-manager/*.php"
      - "warranty-code-manager/**/*.php"

jobs:
  lint:
    name: PHP ${{ matrix.php }} syntax check
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ["8.0", "8.1", "8.2", "8.3"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: none
          coverage: none

      - name: Run php -l on all plugin files
        run: |
          ERROR=0
          while IFS= read -r -d '' file; do
            php -l "$file" || ERROR=1
          done < <(find warranty-code-manager -name "*.php" -print0)
          exit $ERROR